<div id="example-1" class="section level2">
<h2>Example 1</h2>
<div data-py-exercise data-height="260">
<script type="text/plain" class="py-source">
from math import exp
from geometry_module import simpsons_rule, monte_carlo_integral
import matplotlib.pyplot as plt

f = lambda x: exp(-x ** 2)

print('Simpson     :', simpsons_rule(f, 0, 1, 10000))
for i in range(3):
    print(f'Monte Carlo #{i+1}:', round(monte_carlo_integral(f, 0, 1, 10000), 6))
print('Antithetic  :', round(monte_carlo_integral(f, 0, 1, 10000, 'antithetic'), 6))

# Draw the function and shade the area
xs = [i / 200 for i in range(201)]
ys = [f(x) for x in xs]
plt.figure(figsize=(4, 3))
plt.plot(xs, ys, color='steelblue', linewidth=2)
plt.fill_between(xs, ys, alpha=0.25, color='steelblue')
plt.title('y = exp(-x^2) on [0, 1]')
plt.grid(alpha=0.3)
plt.show()
</script>
</div>

<div id="example-2" class="section level2">
<h2>Example 2</h2>
<div data-py-exercise data-height="220">
<script type="text/plain" class="py-source">
from math import exp
from geometry_module import simpsons_rule, monte_carlo_integral
import matplotlib.pyplot as plt

f = lambda x: 3 * x ** 4 * exp(-(x ** 0.75)) / 4

print('Simpson    :', simpsons_rule(f, 0, 40, 10000))
print('Monte Carlo:', monte_carlo_integral(f, 0, 40, 100000))
print('Antithetic :', monte_carlo_integral(f, 0, 40, 100000, 'antithetic'))

xs = [i * 40 / 400 for i in range(401)]
ys = [f(x) for x in xs]
plt.figure(figsize=(4, 3))
plt.plot(xs, ys, color='darkorange', linewidth=2)
plt.fill_between(xs, ys, alpha=0.25, color='darkorange')
plt.title('3x^4 exp(-x^0.75) / 4')
plt.grid(alpha=0.3)
plt.show()
</script>
</div>

<h2>Write your own example</h2>
<div data-py-exercise data-height="240">
<script type="text/plain" class="py-source">
from math import exp
from geometry_module import simpsons_rule, monte_carlo_integral
import matplotlib.pyplot as plt

# ---------- change the function and the interval ----------
f = lambda x: x ** 2 * exp(-x)
a, b = 0, 5
# --------------------------------------------------------

print('Simpson    :', simpsons_rule(f, a, b, 10000))
print('Monte Carlo:', monte_carlo_integral(f, a, b, 100000))

xs = [a + (b - a) * i / 300 for i in range(301)]
ys = [f(x) for x in xs]
plt.figure(figsize=(4, 3))
plt.plot(xs, ys, color='darkorange', linewidth=2)
plt.fill_between(xs, ys, alpha=0.25, color='darkorange')
plt.grid(alpha=0.3)
plt.show()
</script>
