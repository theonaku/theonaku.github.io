<div id="example-1" class="section level2">
<h2>Example 1</h2>
<div data-py-exercise data-height="260">
<script type="text/plain" class="py-source">
import random
from geometry_module import area_mc_method
import matplotlib.pyplot as plt

xe4 = [1, 3, 4, 7, 6, 3, 2]
ye4 = [8, 4, 8, 5, -1, 5, 1]

random.seed(2019)
ray, _, _ = area_mc_method(xe4, ye4, 5000, 'ray')
wind, _, _ = area_mc_method(xe4, ye4, 5000, 'wind')
print('ray casting   :', round(ray, 4))
print('winding number:', round(wind, 4))

plt.figure(figsize=(4, 3))
plt.fill(xe4, ye4, alpha=0.25, edgecolor='steelblue', linewidth=2)
plt.plot(xe4 + [xe4[0]], ye4 + [ye4[0]], 'o-', color='steelblue')
plt.title('Method 3 comparison')
plt.axis('equal')
plt.grid(alpha=0.3)
plt.show()
</script>
</div>

import matplotlib.pyplot as plt
