<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>theonaku</title>
<style>
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --soft: #9198a1;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #ffffff; --fg: #1f2328; --soft: #59636e; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans", Roboto, Helvetica, Arial, sans-serif;
  }
  main { text-align: center; padding: 24px; }
  h1 { margin: 0 0 .4em; font-size: 1.6rem; font-weight: 600; letter-spacing: .02em; }
  p { margin: 0; color: var(--soft); }
</style>
</head>
<body>
<main>
  <h1>theonaku</h1>
  <p>Work in progress.</p>
</main>
</body>
</html>
