<div id="example-1" class="section level2">
<h2>Example 1</h2>
<div data-py-exercise data-height="260">
<script type="text/plain" class="py-source">
from geometry_module import type_of_polygon, classify_polygon
import matplotlib.pyplot as plt

xe1 = [1, 3, 4, 7]
ye1 = [1, 4, 1, 5]

print('type         :', type_of_polygon(xe1, ye1))
print('classification:', classify_polygon(xe1, ye1))

plt.figure(figsize=(4, 3))
plt.fill(xe1, ye1, alpha=0.25, edgecolor='steelblue', linewidth=2)
plt.plot(xe1 + [xe1[0]], ye1 + [ye1[0]], 'o-', color='steelblue')
plt.title('Example 1')
plt.axis('equal')
plt.grid(alpha=0.3)
plt.show()
</script>
</div>
